<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>🛹 SK8 the Infinity 🛹</title>
    <!-- Bootstrap CSS link -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Container (Bootstrap Concept 1: Layout using Container) -->
    <div class="container my-5">
      <h1 class="text-center mb-6">🛹 SK8 the Infinity 🛹</h1>

      <!-- Row and Columns (Bootstrap Concept 2: Grid System) -->
      <div class="row">
        <!-- First Plant -->
        <div class="col-md-6 text-center">
          <img
            src="https://i.pinimg.com/1200x/a7/71/4b/a7714b2c212a65cd419f6d4e3401408c.jpg"
            alt="Adam"
            style="width: 100px; height: 200px; object-fit: cover"
          />
          <h5 class="mt-3">Adam</h5>
          <p>The legend</p>
        </div>

        <!-- Second Plant -->
        <div class="col-md-6 text-center">
          <img
            src="https://i.pinimg.com/1200x/7d/6a/37/7d6a37df133a144757383aeec0df3664.jpg"
            class="img-fluid rounded"
            alt="Cherry"
            style="width: 100px; height: 200px; object-fit: cover"
          />
          <h5 class="mt-3">Cherry</h5>
          <p>The Precision Skater</p>
        </div>

        <!-- Third Plant -->
        <div class="col-md-6 text-center">
          <img
            src="https://i.pinimg.com/1200x/3a/f1/09/3af109701b39a1b7bbc36ea911cb6c40.jpg"
            alt="Joe"
            style="width: 100px; height: 200px; object-fit: cover"
          />
          <h5 class="mt-3">Joe</h5>
          <p>The Powerhouse</p>
        </div>

         <div class="col-md-6 text-center">
          <img
            src="https://i.pinimg.com/736x/c0/df/16/c0df1683a75cd7f64b26cbea31f80ab7.jpg"
            alt="Langa"
            style="width: 100px; height: 200px; object-fit: cover"
    
          />
          <h5 class="mt-3">Langa</h5>
          <p>The Snow</p>
        </div>
      </div>

      <!-- Button (Bootstrap Concept 3: Components) -->
      <div class="text-center mt-4">
        <button class="btn btn-success">See More</button>
      </div>
    </div>
  </body>
</html>
